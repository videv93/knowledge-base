version: 2

models:
  - name: stg_posts
    description: "Cleaned posts with source metadata, normalized dates, and generated slugs"
    columns:
      - name: id
        description: "Post primary key from raw_blog_posts"
        data_tests:
          - unique
          - not_null
      - name: source_id
        description: "FK to raw_blog_sources"
        data_tests:
          - not_null
      - name: source_name
        description: "Blog source name from joined source table"
      - name: category
        description: "Blog source category"
      - name: title
        description: "Cleaned post title (trimmed)"
        data_tests:
          - not_null
      - name: body
        description: "Cleaned post body (trimmed)"
      - name: url
        description: "Original post URL (unique from raw layer)"
        data_tests:
          - unique
          - not_null
      - name: author_name
        description: "Post author name (defaults to 'Unknown' if empty/null)"
        data_tests:
          - not_null
      - name: publication_date
        description: "Normalized publication date (date only, UTC)"
      - name: post_slug
        description: "Preview slug from title for querying. NOT the canonical vault file slug (that is generated by note_generator.py with hash suffix for collisions)."
      - name: created_at
        description: "Record creation timestamp"

  - name: stg_authors
    description: "Deduplicated author profiles with normalized names across sources"
    columns:
      - name: author_id
        description: "Surrogate key: md5 of normalized author name"
        data_tests:
          - unique
          - not_null
      - name: author_name
        description: "Normalized author name (initcap + trimmed). Known limitation: initcap may miscapitalize names like McDonald→Mcdonald or handle prefixes like 'van' inconsistently."
        data_tests:
          - unique
          - not_null
      - name: post_count
        description: "Number of posts by this author"
        data_tests:
          - not_null
      - name: source_ids
        description: "Array of distinct source IDs this author writes for"
      - name: first_seen_at
        description: "Earliest publication date for this author"
      - name: last_seen_at
        description: "Latest publication date for this author"

  - name: stg_summaries
    description: "Validated AI summaries with quality scoring"
    columns:
      - name: id
        description: "Summary primary key"
        data_tests:
          - unique
          - not_null
      - name: post_id
        description: "FK to raw_blog_posts (one summary per post)"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'raw_blog_posts')
                field: id
      - name: summary_text
        description: "AI-generated summary text"
        data_tests:
          - not_null
      - name: tags
        description: "JSONB array of topic tags"
      - name: difficulty_classification
        description: "AI-classified difficulty level"
      - name: is_low_quality
        description: "Quality flag: true if summary < 50 chars or empty tags"
      - name: created_at
        description: "Summary creation timestamp"
