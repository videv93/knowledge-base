[project]
name = "knowledge-base-pipeline"
version = "0.1.0"
description = "Data pipeline for knowledge-base Obsidian vault"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
